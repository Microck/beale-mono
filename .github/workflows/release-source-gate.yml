name: Release source gate

on:
  pull_request_target:
    branches: [release]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  source:
    name: main-to-release
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch in this repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != "main" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "Only this repository's main branch may target release."
            exit 1
          fi
