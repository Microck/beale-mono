# Publishes the already verified v0.9.1 artifacts after the tag workflow's
# changelog-based release notes exceeded GitHub's release body limit.
name: Publish verified Beale 0.9.1 artifacts

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-v0.9.1-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_id == 1350084549 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tag, jobs, and immutable artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=641f7ae4b18b119ef8aabb1824519d3dfe761717
          run_id=40498042355
          test "$(git rev-parse 'refs/tags/v0.9.1^{commit}')" = "$expected_sha"
          git merge-base --is-ancestor "$expected_sha" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" |
            jq -e --arg sha "$expected_sha" '.event == "push" and .head_branch == "v0.9.1" and .head_sha == $sha and .path == ".github/workflows/release.yml"' >/dev/null
          for job_id in 122181734949 122181737365; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id" |
              jq -e --argjson run "$run_id" '.run_id == $run and .status == "completed" and .conclusion == "success"' >/dev/null
          done
          for item in \
            '12733842763 sha256:88651298062376af422b9a75d0f48a259fd0e4eb549a2e03db17bbfe365e95b8 installers-macos' \
            '12732244611 sha256:72aecae92abadb9ece63080f58df3232a75acf7fb48c8b331a3d57a9e0f08763 installers-windows'; do
            read -r artifact_id expected_digest expected_name <<< "$item"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" |
              jq -e --argjson run "$run_id" --arg sha "$expected_sha" --arg digest "$expected_digest" --arg name "$expected_name" \
                '.workflow_run.id == $run and .workflow_run.head_sha == $sha and .digest == $digest and .name == $name and .expired == false' >/dev/null
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: 12733842763,12732244611
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40498042355
          path: installers
          merge-multiple: true
          digest-mismatch: error
      - name: Publish the verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            'Beale-0.9.1-arm64.dmg'
            'Beale-0.9.1-arm64.dmg.blockmap'
            'Beale-0.9.1-arm64-mac.zip'
            'Beale-0.9.1-arm64-mac.zip.blockmap'
            'Beale Setup 0.9.1.exe'
            'Beale Setup 0.9.1.exe.blockmap'
            'latest-mac.yml'
            'latest.yml'
          )
          mapfile -d '' paths < <(find installers -mindepth 1 -print0)
          if [[ ${#paths[@]} -ne ${#expected[@]} ]]; then
            echo 'Unexpected number of release artifacts.'
            exit 1
          fi
          for name in "${expected[@]}"; do
            if [[ ! -f "installers/$name" || -L "installers/$name" ]]; then
              echo "Expected release artifact is missing or invalid: $name"
              exit 1
            fi
          done
          node scripts/release-notes.mjs 0.9.1 notes.md
          (cd installers && sha256sum * > SHA256SUMS.txt)
          gh release create v0.9.1 installers/* \
            --verify-tag \
            --title 'Beale 0.9.1' \
            --notes-file notes.md \
            --latest
